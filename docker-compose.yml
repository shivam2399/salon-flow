version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: salonflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: salon-flow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salonflow_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: salon-flow
      DB_USER: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: supersecretproductionjwtkeywithmorethan32characters12345
      JWT_EXPIRES_IN: 1h
      SALON_SLUG: salonflow-demo
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: salonflow_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
